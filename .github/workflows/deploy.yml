name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # 多入口站点必须用绝对 base，否则子目录页面的 assets 会 404
          BASE_PATH: /${{ github.event.repository.name }}/
          # 站内 LLM 代理（Cloudflare Worker）地址，例如 https://expwall-llm.xxx.workers.dev
          # 在仓库 Settings → Secrets and variables → Actions → Variables 里配置；
          # 没配时这里取到空串 → 前端判定「没有代理」，行为与纯静态站完全一致（回放）。
          VITE_PROXY_BASE_URL: ${{ vars.VITE_PROXY_BASE_URL }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
