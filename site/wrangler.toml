# 作品集站点本体（把 ../dist 直接挂在自有域名的根路径上）
# 为什么另起一个 Worker：GitHub Pages 只能挂在 /exp-wall/ 这个子路径下，且 github.io 在国内访问不稳；
# 把构建产物直接用 Workers 静态资源挂在 agent-lyy.top 根路径，就能「单纯访问 agent-lyy.top」。
# 同一个仓库仍然照常部署 GitHub Pages（那份用 BASE_PATH=/exp-wall/ 构建），两者互不影响。
name = "expwall-site"
compatibility_date = "2026-01-01"
workers_dev = true
# 脚本只为了把 /api/llm/* 同源转给 expwall-llm（见 src/index.js），其余路径仍是纯静态资源。
main = "src/index.js"

# 同源转发：/api/llm/* 先给脚本（run_worker_first），其它路径不经过脚本，直接走静态资源。
[[services]]
binding = "LLM"
service = "expwall-llm"

# ../dist 由 node site/deploy.mjs（= 不设 BASE_PATH 的 npm run build）生成，
# 相对路径按本文件所在目录解析。
[assets]
directory = "../dist"
binding = "ASSETS"
# www → apex 的 301 也要经过脚本，所以把脚本放到所有请求前面（非 /api 的请求原样交给 ASSETS，开销可忽略）。
run_worker_first = true
# 多入口站点：未知路径交给根目录的 404.html（不要 SPA 兜底，那会把 /rag/ 的 404 变成首页）。
# 404.html 里会按当前前缀反推链接，并把访客 6 秒后送回首页。
not_found_handling = "404-page"

# custom_domain = true 让 Cloudflare 自动建 DNS 记录并签发证书（和 llm.agent-lyy.top 一样）
[[routes]]
pattern = "agent-lyy.top"
custom_domain = true

[[routes]]
pattern = "www.agent-lyy.top"
custom_domain = true
