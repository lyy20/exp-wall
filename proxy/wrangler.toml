name = "expwall-llm"
main = "src/index.ts"
compatibility_date = "2026-01-01"
workers_dev = true

# 部署前先建 KV：npx wrangler kv namespace create RATE_KV
# 把命令输出的 id 填到下面（未绑定时 Worker 会按 fail-closed 拒绝服务）。
[[kv_namespaces]]
binding = "RATE_KV"
id = "5ffce11d92cb41e08acf995f7aa0a721"

# ---- 自定义域名：生效中 ----
# 背景：*.workers.dev 在国内被按域名（SNI）阻断（实测同一个 Cloudflare IP 104.16.124.96，
# SNI=www.cloudflare.com 返回 200，SNI=*.workers.dev 直接 RST），所以改用自有域名。
# agent-lyy.top 已托管在 Cloudflare（NS = garrett/pam.ns.cloudflare.com），custom_domain=true
# 会让 Cloudflare 自动建 DNS 记录并签发证书，代码完全不用改。
[[routes]]
pattern = "llm.agent-lyy.top"
custom_domain = true

# ---- Workers AI 绑定（embedding / 精排的第二条后端）----
# 为什么需要：SiliconFlow 的 key 一旦缺失或失效，/api/llm/embeddings 与 /api/llm/rerank 就整条断掉，
# 访客的提问会卡在「拿查询向量」这一步。Workers AI 用同一个 Worker 的 [ai] 绑定兜底（免费档 10000 neurons/天），
# 不需要额外 secret：SiliconFlow 有效时优先用它，401/403 时自动降级到 @cf/baai/bge-m3 与 @cf/baai/bge-reranker-base，
# 响应体里回真实模型名，前端照实显示。
[ai]
binding = "AI"

[vars]
# 只允许作品集站点调用（本机开发端口由 Worker 内部额外放行）
ALLOWED_ORIGINS = "https://lyy20.github.io"
# 上游可选覆盖（测试用）；生产留空即用默认
# UPSTREAM_BASE = "https://api.deepseek.com"
# 想开放 embedding / 精排再多配一个 SILICONFLOW_API_KEY secret，并把上游换上：
# SILICONFLOW_BASE = "https://api.siliconflow.cn/v1"
# 闸门数值可覆盖（JSON）：{"perMinute":3,"perDay":30,"globalPerDay":200,"maxOutputTokens":512}
# LIMITS_JSON = "{\"perMinute\":3,\"perDay\":30,\"globalPerDay\":200,\"maxOutputTokens\":512}"
